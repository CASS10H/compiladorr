name: Universal Build

on:
  push:
    paths:
      - "input/project.zip"
      - "scripts/**"
      - ".github/workflows/universal-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java for Android/Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zip unzip

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install CMake on Windows
        if: runner.os == 'Windows'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        shell: powershell

      - name: Run universal detector and build
        run: python scripts/build.py
        shell: bash

      - name: Upload build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-build-results-${{ matrix.os }}
          path: |
            artifacts/
            work/project/**/build/outputs/**/*.apk
            work/project/**/build/outputs/**/*.aab
          if-no-files-found: warn
          retention-days: 14
